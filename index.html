<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 동네 인구 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #f4f6fb;
      color: #202b43;
      font-family: "Malgun Gothic", sans-serif;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 34px;
      letter-spacing: -1.5px;
    }

    .description {
      margin-bottom: 30px;
      color: #68758a;
      line-height: 1.7;
    }

    .panel {
      padding: 28px;
      background: white;
      border: 1px solid #e1e6ef;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(30, 50, 90, 0.06);
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .search-box {
      position: relative;
    }

    #search {
      width: 100%;
      padding: 16px;
      border: 1px solid #d6dce8;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    #search:focus {
      border-color: #4463dc;
      box-shadow: 0 0 0 3px #e8edff;
    }

    #search:disabled {
      background: #f5f6f8;
    }

    #suggestions {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 10;
      max-height: 280px;
      overflow-y: auto;
      padding: 5px;
      border: 1px solid #e1e6ef;
      border-radius: 12px;
      background: white;
      box-shadow: 0 12px 30px rgba(30, 50, 90, 0.12);
    }

    #suggestions.open {
      display: block;
    }

    .suggestion {
      display: block;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: #202b43;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
    }

    .suggestion:hover,
    .suggestion:focus {
      background: #edf1ff;
      outline: none;
    }

    .hint {
      margin: 10px 0 0;
      color: #7b8799;
      font-size: 12px;
      line-height: 1.6;
    }

    #status {
      margin-top: 18px;
      color: #68758a;
      font-size: 13px;
      line-height: 1.7;
    }

    #status.error {
      color: #c03950;
    }

    #status.success {
      color: #17846c;
    }

    #result {
      display: none;
      margin-top: 28px;
      padding-top: 25px;
      border-top: 1px solid #e5e9f1;
    }

    #result.show {
      display: block;
    }

    .result-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    #region-name {
      margin: 0;
      font-size: 23px;
      letter-spacing: -0.7px;
      line-height: 1.5;
    }

    #month {
      padding: 7px 11px;
      border-radius: 20px;
      background: #edf1ff;
      color: #3559d8;
      font-size: 12px;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      min-width: 0;
      padding: 22px 17px;
      border: 1px solid #e1e6ef;
      border-radius: 14px;
      background: white;
    }

    .card.total {
      background: #f0f3ff;
      border-color: #dce3ff;
    }

    .card-title {
      margin-bottom: 15px;
      color: #68758a;
      font-size: 14px;
      font-weight: bold;
    }

    .card-value {
      font-size: clamp(19px, 3vw, 27px);
      font-weight: 800;
      letter-spacing: -1px;
      overflow-wrap: anywhere;
    }

    .unit {
      margin-left: 4px;
      color: #68758a;
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 0;
    }

    .source {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #e5e9f1;
      color: #7b8799;
      font-size: 12px;
      line-height: 1.8;
    }

    .source a {
      color: #3559d8;
      text-decoration: none;
    }

    .source a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 28px 12px;
      }

      h1 {
        font-size: 28px;
      }

      .panel {
        padding: 18px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 17px;
      }

      .card-title {
        margin-bottom: 0;
      }

      .card-value {
        text-align: right;
      }

      .result-heading {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>우리 동네 인구 찾기</h1>

    <p class="description">
      궁금한 지역을 검색하고 선택하면 총인구와 남자·여자 인구를 확인할 수 있습니다.
    </p>

    <section class="panel">
      <label for="search">어느 동네가 궁금하세요?</label>

      <div class="search-box">
        <input
          id="search"
          type="text"
          placeholder="예: 신림동, 관악구, 서울특별시"
          autocomplete="off"
          disabled
        >

        <div id="suggestions"></div>
      </div>

      <p class="hint">
        시·도, 시·군·구, 읍·면·동 이름을 검색하세요.
        같은 이름의 지역은 전체 행정구역명으로 구분됩니다.
      </p>

      <div id="status" role="status" aria-live="polite">
        인구 데이터를 불러오는 중입니다.
      </div>

      <section id="result">
        <div class="result-heading">
          <h2 id="region-name"></h2>
          <span id="month"></span>
        </div>

        <div class="cards">
          <div class="card total">
            <div class="card-title">총인구</div>
            <div class="card-value" id="total">—</div>
          </div>

          <div class="card">
            <div class="card-title">남자 인구</div>
            <div class="card-value" id="male">—</div>
          </div>

          <div class="card">
            <div class="card-title">여자 인구</div>
            <div class="card-value" id="female">—</div>
          </div>
        </div>
      </section>

      <div class="source">
        자료: 행정안전부 주민등록 인구통계 원본 CSV<br>
        <a
          href="https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv"
          target="_blank"
          rel="noopener noreferrer"
        >원본 CSV 파일 열기 ↗</a>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const CSV_URL =
      "https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv";

    const searchInput = document.getElementById("search");
    const suggestionsBox = document.getElementById("suggestions");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");

    const numberFormat = new Intl.NumberFormat("ko-KR");

    let locations = [];
    let columns = null;
    let currentSuggestions = [];
    let activeIndex = -1;

    // CSV를 행과 열로 분리합니다.
    // 따옴표로 묶인 "9,289,813" 같은 숫자도 하나의 값으로 읽습니다.
    function parseCSV(text) {
      const rows = [];

      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (inQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            field += ch;
          }
        } else if (ch === '"' && field.trim() === "") {
          field = "";
          inQuotes = true;
        } else if (ch === ",") {
          row.push(field);
          field = "";
        } else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && text[i + 1] === "\n") {
            i++;
          }

          row.push(field);
          rows.push(row);

          row = [];
          field = "";
        } else {
          field += ch;
        }
      }

      if (field.length || row.length) {
        row.push(field);
        rows.push(row);
      }

      return rows.filter(r => r.some(cell => cell.trim() !== ""));
    }

    // 지역 이름 맨 뒤의 괄호 속 숫자 코드만 제거합니다.
    // 예: 서울특별시 종로구 청운효자동(1111051500)
    //  -> 서울특별시 종로구 청운효자동
    function cleanRegionName(name) {
      return String(name || "")
        .replace(/\s*\(\s*\d+\s*\)\s*$/, "")
        .trim();
    }

    // 쉼표를 제거한 뒤 인구수를 숫자로 변환합니다.
    function parseCount(value) {
      const cleaned = String(value ?? "")
        .replace(/,/g, "")
        .trim();

      if (!cleaned || cleaned === "-" || cleaned === "—") {
        return null;
      }

      const number = Number(cleaned);

      return Number.isFinite(number) ? number : null;
    }

    // 가장 최근 월의 총인구·남자·여자 인구 열을 찾습니다.
    function findPopulationColumns(headers) {
      const months = new Set();

      for (const header of headers) {
        const match = header.match(
          /^(\d{4}년\d{2}월)_(?:(?:계|남|여)_)?총인구수$/
        );

        if (match) {
          months.add(match[1]);
        }
      }

      const sortedMonths = [...months].sort((a, b) => {
        function monthKey(value) {
          return Number(value.slice(0, 4)) * 100 +
                 Number(value.slice(5, 7));
        }

        return monthKey(b) - monthKey(a);
      });

      for (const month of sortedMonths) {
        const totalCandidates = [
          month + "_계_총인구수",
          month + "_총인구수"
        ];

        const total = headers.findIndex(
          header => totalCandidates.includes(header)
        );

        const male = headers.indexOf(month + "_남_총인구수");
        const female = headers.indexOf(month + "_여_총인구수");

        if (male >= 0 && female >= 0) {
          return {
            month,
            total,
            male,
            female
          };
        }
      }

      throw new Error(
        "총인구·남자·여자 인구 열을 찾지 못했습니다. CSV의 열 이름을 확인해 주세요."
      );
    }

    function setStatus(message, type = "") {
      statusBox.className = type;
      statusBox.textContent = message;
    }

    function normalize(value) {
      return String(value || "")
        .toLocaleLowerCase("ko-KR")
        .replace(/\s+/g, " ")
        .trim();
    }

    // 검색어와 일치하는 지역 목록을 표시합니다.
    function renderSuggestions(query) {
      suggestionsBox.replaceChildren();
      currentSuggestions = [];
      activeIndex = -1;

      const q = normalize(query);

      if (!q || !locations.length) {
        suggestionsBox.classList.remove("open");
        return;
      }

      const matching = locations.filter(item =>
        normalize(item.name).includes(q)
      );

      matching.sort((a, b) => {
        function rank(item) {
          const name = normalize(item.name);
          const lastPart = normalize(item.name.split(" ").pop());

          if (name.startsWith(q)) return 0;
          if (lastPart.startsWith(q)) return 1;

          return 2;
        }

        return rank(a) - rank(b) ||
          a.name.localeCompare(b.name, "ko");
      });

      currentSuggestions = matching.slice(0, 30);

      if (!currentSuggestions.length) {
        const empty = document.createElement("div");
        empty.className = "suggestion";
        empty.textContent = "검색 결과가 없습니다.";
        suggestionsBox.appendChild(empty);
      } else {
        currentSuggestions.forEach((item, index) => {
          const button = document.createElement("button");

          button.type = "button";
          button.className = "suggestion";
          button.textContent = item.name;

          button.addEventListener("mousedown", event => {
            event.preventDefault();
          });

          button.addEventListener("click", () => {
            chooseLocation(item);
          });

          suggestionsBox.appendChild(button);
        });

        if (matching.length > 30) {
          const note = document.createElement("div");
          note.className = "suggestion";
          note.textContent =
            "검색 결과가 많습니다. 지역명을 더 입력해 보세요.";
          note.style.color = "#7b8799";

          suggestionsBox.appendChild(note);
        }
      }

      suggestionsBox.classList.add("open");
    }

    // 사용자가 선택한 지역의 인구를 표시합니다.
    function chooseLocation(item) {
      suggestionsBox.classList.remove("open");

      searchInput.value = item.name;

      document.getElementById("region-name").textContent = item.name;
      document.getElementById("month").textContent =
        columns.month + " 기준";

      const male = parseCount(item.values[columns.male]);
      const female = parseCount(item.values[columns.female]);

      let total = columns.total >= 0
        ? parseCount(item.values[columns.total])
        : null;

      // 총인구 열이 없거나 값이 비어 있으면 남녀 인구를 합산합니다.
      if (total === null && male !== null && female !== null) {
        total = male + female;
      }

      showNumber("total", total);
      showNumber("male", male);
      showNumber("female", female);

      resultBox.classList.add("show");

      setStatus(
        "전체 " + numberFormat.format(locations.length) +
        "개 행정구역 중 선택했습니다.",
        "success"
      );
    }

    function showNumber(id, value) {
      const element = document.getElementById(id);

      element.replaceChildren();

      if (value === null || value === undefined) {
        element.textContent = "자료 없음";
        return;
      }

      element.appendChild(
        document.createTextNode(numberFormat.format(value))
      );

      const unit = document.createElement("span");
      unit.className = "unit";
      unit.textContent = "명";

      element.appendChild(unit);
    }

    // 원본 CSV를 불러와 검색에 사용할 데이터를 준비합니다.
    async function loadCSV() {
      setStatus("인구 데이터를 불러오는 중입니다.");

      try {
        const response = await fetch(CSV_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            "원본 CSV 요청에 실패했습니다. (HTTP " +
            response.status + ")"
          );
        }

        // 원본 파일을 바이트 단위로 읽은 후 EUC-KR로 디코딩합니다.
        const buffer = await response.arrayBuffer();

        const decoder = new TextDecoder("euc-kr");
        let text = decoder.decode(buffer);

        text = text.replace(/^\uFEFF/, "");

        const rows = parseCSV(text);

        if (rows.length < 2) {
          throw new Error("CSV에 읽을 수 있는 데이터가 없습니다.");
        }

        const headers = rows[0].map(header =>
          header.trim().replace(/^\uFEFF/, "")
        );

        const regionColumn = headers.findIndex(header =>
          header === "행정구역" || header.includes("행정구역")
        );

        if (regionColumn < 0) {
          throw new Error("지역 이름 열(행정구역)을 찾지 못했습니다.");
        }

        columns = findPopulationColumns(headers);

        locations = rows.slice(1)
          .map(row => ({
            name: cleanRegionName(row[regionColumn]),
            values: row
          }))
          .filter(item => item.name);

        if (!locations.length) {
          throw new Error("표시할 행정구역 데이터가 없습니다.");
        }

        searchInput.disabled = false;

        setStatus(
          "데이터 불러오기 완료 · " +
          numberFormat.format(locations.length) +
          "개 행정구역",
          "success"
        );

      } catch (error) {
        console.error(error);

        const message = error instanceof TypeError
          ? "데이터를 불러오지 못했습니다. 인터넷 연결이나 원본 서버의 접근 허용(CORS)을 확인해 주세요."
          : error.message;

        setStatus(message, "error");

        const link = document.createElement("a");
        link.href = CSV_URL;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "원본 CSV 파일 열기";
        link.style.display = "inline-block";
        link.style.marginTop = "8px";

        statusBox.appendChild(document.createElement("br"));
        statusBox.appendChild(link);
      }
    }

    // 입력할 때마다 검색 결과를 갱신합니다.
    searchInput.addEventListener("input", () => {
      resultBox.classList.remove("show");
      renderSuggestions(searchInput.value);
    });

    // 키보드 방향키와 Enter 키로도 지역을 선택할 수 있습니다.
    searchInput.addEventListener("keydown", event => {
      if (!suggestionsBox.classList.contains("open")) {
        if (event.key === "Enter" && searchInput.value.trim()) {
          renderSuggestions(searchInput.value);
        }
        return;
      }

      const buttons = [
        ...suggestionsBox.querySelectorAll("button.suggestion")
      ];

      if (event.key === "ArrowDown") {
        event.preventDefault();

        if (buttons.length) {
          activeIndex = Math.min(activeIndex + 1, buttons.length - 1);
        }

      } else if (event.key === "ArrowUp") {
        event.preventDefault();

        if (buttons.length) {
          activeIndex = Math.max(activeIndex - 1, 0);
        }

      } else if (event.key === "Enter") {
        event.preventDefault();

        if (activeIndex >= 0 && currentSuggestions[activeIndex]) {
          chooseLocation(currentSuggestions[activeIndex]);
        } else if (currentSuggestions.length === 1) {
          chooseLocation(currentSuggestions[0]);
        }

        return;

      } else if (event.key === "Escape") {
        suggestionsBox.classList.remove("open");
        return;

      } else {
        return;
      }

      buttons.forEach((button, index) => {
        button.classList.toggle("active", index === activeIndex);
      });

      if (buttons[activeIndex]) {
        buttons[activeIndex].scrollIntoView({
          block: "nearest"
        });
      }
    });

    // 검색 영역 바깥을 클릭하면 검색 결과 목록을 닫습니다.
    document.addEventListener("click", event => {
      if (!event.target.closest(".search-box")) {
        suggestionsBox.classList.remove("open");
      }
    });

    // 페이지를 열면 데이터를 자동으로 불러옵니다.
    loadCSV();
  </script>
</body>
</html>
